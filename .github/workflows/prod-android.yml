name: Build Android

on:
  workflow_run:
    workflows: ["Build desktop"]
    types:
      - completed

permissions:
  contents: write

jobs:
  android-build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./materialious/android

    steps:
      - name: Resolve released version
        id: release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Verify checked out version matches release
        run: |
          PACKAGED=$(jq -r .version ../package.json)
          if [ "$PACKAGED" != "${{ steps.release.outputs.tag }}" ]; then
            echo "::error::Latest release is ${{ steps.release.outputs.tag }} but checked out tree is $PACKAGED"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install modules
        run: cd ../ && npm ci

      - name: Build android nodejs packages
        run: cd ../static/nodejsAndroid && npm ci

      - name: Build package
        run: cd ../ && npm run build

      - name: Sync package
        run: cd ../ && npx cap sync

      - name: Prune dev modules
        run: cd ../ && npm prune --omit=dev

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Build App
        run: |
          bash gradlew assembleRelease
          bash gradlew bundleRelease

      - name: Sign App
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*-unsigned.apk)
          bundles=(app/build/outputs/bundle/release/*.aab)
          (( ${#apks[@]} > 0 && ${#bundles[@]} > 0 ))

          signing_dir=$(mktemp -d)
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > "$signing_dir/release.jks"
          chmod 600 "$signing_dir/release.jks"
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          if [ ! -x "$build_tools/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null
          fi
          mkdir -p app/release

          for apk in "${apks[@]}"; do
            name=$(basename "${apk%-unsigned.apk}")
            "$build_tools/zipalign" -f -P 16 4 "$apk" "$signing_dir/aligned.apk"
            "$build_tools/apksigner" sign \
              --ks "$signing_dir/release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "app/release/$name-signed.apk" \
              "$signing_dir/aligned.apk"
            "$build_tools/apksigner" verify "app/release/$name-signed.apk"
          done

          for bundle in "${bundles[@]}"; do
            name=$(basename "${bundle%.aab}")
            jarsigner -keystore "$signing_dir/release.jks" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -keypass:env ANDROID_KEY_PASSWORD \
              -signedjar "app/release/$name-signed.aab" \
              "$bundle" "$ANDROID_KEY_ALIAS"
            jarsigner -verify "app/release/$name-signed.aab"
          done

      - name: Upload APKs to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./materialious/android/app/release/*-signed.apk
          tag: ${{ steps.release.outputs.tag }}
          release_name: ${{ steps.release.outputs.tag }}
          overwrite: true
          file_glob: true
          draft: false

      - name: Upload AABs to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./materialious/android/app/release/*-signed.aab
          tag: ${{ steps.release.outputs.tag }}
          release_name: ${{ steps.release.outputs.tag }}
          overwrite: true
          file_glob: true
          draft: false
