name: Build desktop

on:
  workflow_call:

permissions:
  contents: write

jobs:
  desktop-build:
    env:
      PUBLISH_FOR_PULL_REQUEST: true

    strategy:
      matrix:
        node-version: [26]
        runtime:
          - linux-x64
          - win-x64
          - osx-x64

        include:
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: osx-x64
            os: macOS-latest
          - runtime: win-x64
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install modules
        run: cd ./materialious && npm ci

      - name: Build package
        run: cd ./materialious && npm run build

      - name: Sync electron package
        run: cd ./materialious && npx cap sync @capacitor-community/electron

      - name: Prune dev modules
        run: cd ./materialious && npm prune --omit=dev

      - name: Patch capacitor plugin
        run: cd ./materialious/electron && python patch_capacitor_plugin.py

      - name: Install electron modules
        run: cd ./materialious/electron && npm install

      - name: Set up environment variables
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
        shell: bash
        if: runner.os != 'Windows'

      - name: Set up environment variables
        run: echo GH_TOKEN=${{ secrets.GITHUB_TOKEN }} >> $env:GITHUB_ENV
        shell: powershell
        if: runner.os == 'Windows'

      - name: Install snapcraft
        if: matrix.runtime == 'linux-x64' || matrix.runtime == 'linux-arm64'
        run: |
          change_id=$(sudo timeout 2m snap install snapcraft --classic --no-wait)
          for attempt in 1 2 3 4 5; do
            if sudo timeout 3m snap watch "$change_id"; then
              exit 0
            else
              result=$?
            fi
            echo "Snapcraft installation status (check ${attempt}/5):"
            sudo timeout 30s snap tasks "$change_id" || true
            if [ "$result" -ne 124 ]; then
              break
            fi
          done

          echo "Snapcraft installation failed; collecting snapd diagnostics"
          sudo timeout 30s snap tasks "$change_id" || true
          sudo systemctl status snapd --no-pager || true
          sudo journalctl -u snapd --no-pager -n 200 || true
          exit 1

      - name: Set up snapcraft environment variables
        run: echo "SNAPCRAFT_STORE_CREDENTIALS=${{ secrets.SNAPCRAFT_LOGIN }}" >> $GITHUB_ENV
        shell: bash
        if: matrix.runtime == 'linux-x64' || matrix.runtime == 'linux-arm64'

      - name: Build desktop packages
        shell: bash
        run: |
          cd ./materialious/electron
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            if npm run electron:make-no-publish; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying in 10 seconds"
              sleep 10
            fi
          done
          echo "Build failed after 3 attempts"
          exit 1

      - name: Save desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runtime }}
          path: |
            materialious/electron/dist/*.yml
            materialious/electron/dist/*.blockmap
            materialious/electron/dist/*.exe
            materialious/electron/dist/*.dmg
            materialious/electron/dist/*.zip
            materialious/electron/dist/*.7z
            materialious/electron/dist/*.deb
            materialious/electron/dist/*.rpm
            materialious/electron/dist/*.AppImage
            materialious/electron/dist/*.snap
          if-no-files-found: error
