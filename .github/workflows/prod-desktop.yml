name: Build desktop

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "./fastline/**"
      - "./materialious/src/lib/i18n/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    uses: ./.github/workflows/release-gate.yml
    with:
      sha: ${{ github.sha }}
      shas: ${{ github.event_name == 'push' && join(github.event.commits.*.sha, ' ') || '' }}

  desktop-build-1:
    needs: gate
    if: needs.gate.outputs.skip == 'false'
    uses: ./.github/workflows/reusable-desktop-build.yml
    secrets: inherit

  desktop-build-2:
    needs: desktop-build-1
    if: failure()
    uses: ./.github/workflows/reusable-desktop-build.yml
    secrets: inherit

  desktop-build-3:
    needs: desktop-build-2
    if: failure()
    uses: ./.github/workflows/reusable-desktop-build.yml
    secrets: inherit
